<!DOCTYPE html>
<html lang="pt-BR">
<head>
   <title>VoluntariAI Cadastro de vagas</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Etapa2.css">
</head>
<body>
<header class = "topo">
    <div class = "logo">VoluntariAI</div>
    <nav>
      <a href="../tela-Sobre/tela-Sobre.html">Sobre</a>
      <a href="../tela-QuemSomos/tela-QuemSomos.html">Quem Somos </a>
      <a href="../TelaVagasVoluntario/Vagas.html">Vagas</a>
      <a href="#" class="ativo" id="btnPerfil">Perfil</a>
    </nav>
  </header>

   <main>

    <section class="top-text">
        <h1>Cadastrar Vagas</h1>
        <p>Cadastre oportunidades de voluntariado.</p>
    </section>

    <div class="container">

        <h2>Etapa 2 - Detalhes da vaga</h2>

        <label>Sobre a vaga <span>*</span></label>
        <textarea id="vaga" placeholder="Descreva a vaga e seu objetivo" required></textarea>
        <small class="erro" id="erroVaga"></small>

        <label>Atividades <span>*</span></label>
        <textarea id="atividades" placeholder="Liste as atividades que o voluntário irá realizar" required></textarea>
        <small class="erro" id="erroAtividades"></small>

        <label>Requisitos <span>*</span></label>
        <textarea id="requisitos" placeholder="Informe os requisitos necessários" required></textarea>
        <small class="erro" id="erroRequisitos"></small>

       <div class="botoes">
        <button class="cancelar" onclick="history.back()">Cancelar</button>
       <a href="" id="btnConcluído">
        Concluído
     </a>
    </div>
    </div>

</main>
<script src="Etapa2.js"></script>
</body>
</html>
