<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Perfil Voluntário</title>

    <link rel="stylesheet" href="editarVolun.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <!-- TOPO -->
    <header class="topo">

        <div class="logo">
            VoluntariAI
        </div>

        <nav>
           <a href="../tela-Sobre/tela-Sobre.html">Sobre</a>
      <a href="../tela-QuemSomos/tela-QuemSomos.html">Quem Somos </a>
      <a href="../TelaVagasVoluntario/Vagas.html">Vagas</a>
      <a href="../telaPerfil/perfilVolun.html" class="ativo" id="btnPerfil">Perfil</a>
        </nav>

    </header>


    <!-- LAYOUT -->
    <div class="layout">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div class="perfil">

                <div class="foto" id="fotoSidebar">
                    <i class="fa-solid fa-user"></i>

                </div>

                <p id="nomeSidebar">
                    Usuário
                </p>

            </div>


            <!-- MENU -->
            <nav class="menu">

                <div class="menu-titulo">

                    <span>Perfil</span>

                    <i class="fa-solid fa-chevron-up"></i>

                </div>

                <ul>

                    <li>
                        <a href="#" class="ativoMenu">
                            Editar Perfil
                        </a>
                    </li>

                    <li>
                        <a href="../telaPerfil/historicodtraVo.html">
                        Histórico de Trabalho
                        </a>
                    </li>

                    <li>
                        <a href="editarDadosVolun.html">
                      Editar Dados
                        </a>
                    </li>

                </ul>

            </nav>

        </aside>


        <!-- CONTEÚDO -->
        <main>

            <!-- BANNER -->
            <div 
                 class="banner" 
                 id="bannerusu">

                <button id="btnRemoverBanner">
                    Remover Banner
                </button>

                <input
                    type="file"
                    id="inputBanner"
                    accept="image/*"
                    hidden>


                <!-- FOTO PERFIL -->
                <div
                    class="fotoperfil"
                    id="fotoPerfilPrincipal">
                    
                    <input
                        type="file"
                        id="inputFotoPerfil"
                        accept="image/*"
                        hidden>

                    <i class="fa-solid fa-user"></i>
                
                </div>
                <button id="btnRemoverFotoPerfil">
                        Remover Foto
                    </button>
            </div>


            <!-- INFORMAÇÕES -->
            <section class="perfilinfo">

                <div class="textousu">

                    <!-- NOME -->
                    <input
                        type="text"
                        id="inputNomeVolun"
                        class="inputNome"
                        placeholder="Nome de Usuário">

                        

            
<select class="selecione" id="inputCategoria">
    <option value="">Informe sua categoria</option>
  <option value="Voluntário">Voluntário</option>
  <option value="Voluntário PSC">Voluntário PSC</option>
</select>

                    <p>
                        Atualize as informações de Usuário
                    </p>

                </div>

            </section>


            <!-- ALTERAR BANNER -->
            <section class="blocoUpload">

                <label>
                    Alterar Banner
                </label>
            </section>
            <!-- APRESENTAÇÃO -->
            <section class="bloco">

                <h3>Apresentação</h3>

                <textarea
                    id="inputApresentacao"
                    placeholder="Fale sobre você..."></textarea>

            </section>

<!--Disponibilidade-->
<section class="bloco">
<h3>Disponibilidade</h3>
<select
    class="selecione1"
    id="inputDisponibilidade">

<option value="">
    Selecione sua disponibilidade
</option>

<option value="Manhã">
    Manhã
</option>

<option value="Tarde">
    Tarde
</option>

<option value="Noite">
    Noite
</option>

</select>
</section>
<!--Habilidades e interesses-->
            <section class="bloco">

                <h3>Habilidades e interesses</h3>

                <textarea id="habilidadeseint"
                    placeholder="Descreva suas habilidades e interesses..."></textarea>

            </section>

            <!-- BOTÃO -->
            <button id="btnSalvar">

                Salvar Alterações

            </button>
  <button id="btnvoltar">

                Voltar para Perfil

            </button>

        </main>

    </div>

    <script src="editarVolun.js"></script>

</body>

</html>
